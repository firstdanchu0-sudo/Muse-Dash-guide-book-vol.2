<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191c">
<title>Muse Dash Advanced Guide Vol. 02</title>
<style>
:root{
 --bg:#17191c;--panel:#22252a;--line:#3b3f45;--text:#f4f2ee;
 --muted:#92979d;--gold:#e5c453;--cyan:#5fcbc4;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Arial,"Noto Sans KR",sans-serif;overflow:hidden;user-select:none}
header{
 height:58px;display:flex;align-items:center;justify-content:space-between;
 padding:0 18px;border-bottom:1px solid var(--line);background:rgba(23,25,28,.96);
 position:relative;z-index:20
}
.brand{font-weight:900;letter-spacing:.035em;white-space:nowrap}
.brand .gold{color:var(--gold)}
.toolbar{display:flex;gap:8px}
button{
 appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
 padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:700
}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.25;cursor:default}
.stage{
 height:calc(100% - 92px);position:relative;display:flex;align-items:center;
 justify-content:center;padding:20px 70px 10px
}
.book{
 height:min(82vh,900px);width:min(1500px,92vw);
 display:flex;justify-content:center;align-items:center;gap:8px;perspective:1600px
}
.page{
 height:100%;min-width:0;flex:1 1 0;display:flex;align-items:center;justify-content:center;
 background:#111214;border:1px solid #30343a;overflow:hidden;
 box-shadow:0 20px 55px rgba(0,0,0,.42)
}
.page.left{border-radius:12px 3px 3px 12px}
.page.right{border-radius:3px 12px 12px 3px}
.page.single{flex:0 1 auto;width:min(820px,86vw);border-radius:12px}
.page img{display:block;width:100%;height:100%;object-fit:contain;background:#111214}
.spine{
 width:13px;height:100%;margin:0 -9px;z-index:3;pointer-events:none;
 background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(0,0,0,.62),rgba(255,255,255,.025))
}
.nav{
 position:absolute;top:50%;transform:translateY(-50%);width:48px;height:76px;
 padding:0;font-size:30px;background:rgba(34,37,42,.86);z-index:10
}
.prev{left:12px}.next{right:12px}
footer{
 height:34px;display:flex;align-items:center;justify-content:center;
 color:var(--muted);font-size:13px;position:relative
}
.help{position:absolute;right:18px;color:var(--cyan)}
.fade{animation:fade .16s ease-out}
@keyframes fade{from{opacity:.5;transform:scale(.995)}to{opacity:1;transform:scale(1)}}

@media(max-width:800px){
 header{height:54px;padding:0 10px}
 .brand{font-size:12px}
 .toolbar button{font-size:11px;padding:7px 8px}
 .stage{height:calc(100% - 86px);padding:10px 44px 6px}
 .book{height:78vh;width:100%}
 .page.single{width:100%}
 .nav{width:38px;height:62px;font-size:25px}
 .prev{left:2px}.next{right:2px}
 .help{display:none}
}
</style>
</head>
<body>
<header>
 <div class="brand">MUSE DASH <span class="gold">ADVANCED GUIDE VOL. 02</span></div>
 <div class="toolbar">
   <button id="mode">한 장 보기</button>
   <button id="full">전체화면</button>
 </div>
</header>

<main class="stage" id="stage">
 <button class="nav prev" id="prev" aria-label="이전 페이지">‹</button>
 <div class="book fade" id="book"></div>
 <button class="nav next" id="next" aria-label="다음 페이지">›</button>
</main>

<footer>
 <span id="status"></span>
 <span class="help">← → 방향키 · 화면 좌우 클릭</span>
</footer>

<script>
const TOTAL=41;
const sources=Array.from({length:TOTAL},(_,i)=>`pages/${i+1}.png`);
let index=0;
let spread=window.innerWidth>800;

const book=document.querySelector('#book');
const status=document.querySelector('#status');
const prev=document.querySelector('#prev');
const next=document.querySelector('#next');
const mode=document.querySelector('#mode');
const full=document.querySelector('#full');
const stage=document.querySelector('#stage');

function page(n, cls=''){
 const el=document.createElement('div');
 el.className='page '+cls;
 const img=document.createElement('img');
 img.src=sources[n]; img.alt=`${n+1} 페이지`; img.draggable=false;
 el.appendChild(img); return el;
}
function render(){
 book.innerHTML='';
 book.classList.remove('fade'); void book.offsetWidth; book.classList.add('fade');

 if(!spread || index===0 || index===TOTAL-1){
   book.appendChild(page(index,'single'));
   status.textContent=`${index+1} / ${TOTAL}`;
 }else{
   let left=index;
   if(left%2===0) left--;
   left=Math.max(1,left);
   const right=left+1;
   index=left;
   book.appendChild(page(left,'left'));
   const s=document.createElement('div');s.className='spine';book.appendChild(s);
   if(right<TOTAL) book.appendChild(page(right,'right'));
   else {const blank=document.createElement('div');blank.className='page right';book.appendChild(blank);}
   status.textContent=`${left+1}–${Math.min(right+1,TOTAL)} / ${TOTAL}`;
 }
 prev.disabled=index===0;
 next.disabled=index===TOTAL-1;
 mode.textContent=spread?'한 장 보기':'두 장 보기';
 preload();
}
function goNext(){
 if(index>=TOTAL-1)return;
 if(!spread) index++;
 else if(index===0) index=1;
 else if(index>=TOTAL-3) index=TOTAL-1;
 else index+=2;
 render();
}
function goPrev(){
 if(index<=0)return;
 if(!spread) index--;
 else if(index<=2) index=0;
 else if(index===TOTAL-1) index=TOTAL-4;
 else index-=2;
 render();
}
function preload(){
 [index-2,index-1,index+1,index+2].forEach(i=>{
   if(i>=0&&i<TOTAL){const im=new Image();im.src=sources[i];}
 });
}
prev.onclick=goPrev; next.onclick=goNext;
mode.onclick=()=>{spread=!spread;render()};
full.onclick=async()=>{
 try{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){}
};
document.addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();goNext()}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goPrev()}
});
stage.addEventListener('click',e=>{
 if(e.target.closest('button'))return;
 if(e.clientX<innerWidth/2)goPrev(); else goNext();
});
let touchX=null;
stage.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{
 if(touchX===null)return;
 const dx=e.changedTouches[0].clientX-touchX;
 if(Math.abs(dx)>45)(dx<0?goNext:goPrev)();
 touchX=null;
},{passive:true});
window.addEventListener('resize',()=>{
 if(window.innerWidth<=800 && spread){spread=false;render();}
});
render();
</script>
</body>
</html>
